              "text": "P2P.me is a global platform that lets you easily buy, sell, and pay using USDC — securely and privately. It supports popular local payment methods like UPI, PIX, and QRIS, while keeping your funds fully in your control."

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. P2P.me is designed with user safety at its core. All merchants on the platform are personally verified. Before onboarding, they must submit zero-knowledge proofs (ZK-proofs) of their banking activity to prove that they are legitimate, active users with no history of bank freezes or fraudulent behavior."

          },
          {
            "@type": "Question",

            "@type": "Question",

          },
          {
            "@type": "Question",
            "name": "What fees does P2P.me charge?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There are no fees charged by the protocol at the moment. The USDC price you see is set by the P2P.me protocol to ensure fairness and simplicity for early users."

          },
          {
            "@type": "Question",
            "name": "Can I scan any QR code and pay with USDC on P2P.me?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Tap Scan & Pay QR, scan a UPI (India), PIX (Brazil) or QRIS (Indonesia) QR code, enter the amount if it is not prefilled, and a verified merchant fulfils the payment in local currency while you pay in USDC."
            }
          },
          {
            "@type": "Question",

      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px">
        <h1>P2P.me - Pay with USDC at any QR</h1>
        <p>Pay with USDC at any QR code using P2P.me.</p>
        <p>
          P2P.me is a self-custodial, peer-to-peer platform on Base that lets you buy USDC with your
          local currency, sell USDC to your bank or mobile-money account, and pay any merchant QR code
          with USDC. Transactions are gasless, no KYC is needed to start, and your funds always stay in
          your own wallet.
        </p>
        <h2>What you can do</h2>
        <ul>
          <li><strong>Buy USDC</strong> via UPI, PIX, QRIS, M-Pesa, bank transfer and more.</li>
          <li><strong>Sell USDC</strong> and receive local currency directly to your payment details.</li>
          <li><strong>Scan &amp; Pay</strong> any merchant QR code with USDC; the merchant gets local currency.</li>
          <li><strong>Deposit and withdraw</strong> USDC across Ethereum, Solana, Polygon, Arbitrum, Optimism and BSC.</li>
          <li><strong>Raise your limits</strong> with zero-knowledge verifications; no personal data is stored.</li>
        </ul>
        <h2>Supported countries</h2>
        <p>
          India (UPI), Indonesia (QRIS), Brazil (PIX), Argentina, Venezuela (Pago Movil), Bolivia (QR
          Simple), Nigeria, Colombia, Cuba, Ecuador, Peru (Yape / Plin), Philippines (InstaPay) and Kenya
          (M-Pesa).
        </p>
        <p>
          This app requires JavaScript. Learn more at <a href="https://p2p.me">p2p.me</a>, read the
          <a href="https://docs.p2p.foundation">docs</a>, or <a href="/login">log in</a>.
        </p>
